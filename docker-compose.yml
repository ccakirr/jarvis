services:
  jarvis:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      JARVIS_API_URL: http://127.0.0.1:8000
    volumes:
      - ./backend/storage:/app/backend/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
